name: Verify V7 Local Font Library

on:
  push:
    branches:
      - v7-local-font-library

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: v7-local-font-library
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Apply local font library implementation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          menu = '''<div id="fontPickerMenu" class="font-picker-menu font-library-menu hidden" role="dialog" aria-label="คลังฟอนต์">
                    <div class="font-library-head">
                      <input id="fontSearchInput" class="font-search-input" type="search" placeholder="ค้นหาฟอนต์..." autocomplete="off" spellcheck="false" aria-label="ค้นหาฟอนต์">
                      <button id="fontRefreshBtn" class="font-library-refresh" type="button" title="โหลดรายชื่อฟอนต์ที่ติดตั้งในเครื่อง">ฟอนต์ในเครื่อง</button>
                    </div>
                    <div class="font-library-tabs" role="tablist" aria-label="ตัวกรองฟอนต์">
                      <button type="button" data-font-mode="all" class="active" role="tab">ทั้งหมด</button>
                      <button type="button" data-font-mode="recent" role="tab">ล่าสุด</button>
                      <button type="button" data-font-mode="favorites" role="tab">★ โปรด</button>
                    </div>
                    <div class="font-library-meta"><span id="fontLibraryStatus">ฟอนต์พื้นฐาน 6 แบบ</span><span id="fontLibraryShown"></span></div>
                    <div id="fontLibraryList" class="font-library-list" role="listbox" aria-label="รายการฟอนต์"></div>
                    <div id="fontLibraryEmpty" class="font-library-empty hidden">ไม่พบฟอนต์ที่ค้นหา</div>
                    <div class="font-library-foot">ฟอนต์อ่านจากเครื่องนี้เท่านั้น · ไม่มีการอัปโหลดฟอนต์ขึ้นเซิร์ฟเวอร์</div>
                  </div>'''

          for name in ('index.html','v3-preview.html'):
              p=Path(name); s=p.read_text(encoding='utf-8')
              s=s.replace('aria-haspopup="listbox" aria-expanded="false"','aria-haspopup="dialog" aria-expanded="false"',1)
              pat=r'<div id="fontPickerMenu" class="font-picker-menu hidden" role="listbox">.*?</div>\n\s*(?=<select id="fontFamily")'
              s2,n=re.subn(pat,menu+'\n                  ',s,count=1,flags=re.S)
              if n!=1: raise SystemExit(f'{name}: font menu patch count={n}')
              p.write_text(s2,encoding='utf-8')

          css=Path('css/ux-redesign.css')
          s=css.read_text(encoding='utf-8')
          marker='/* V7 local font library */'
          if marker not in s:
              s += '''\n\n/* V7 local font library */
.font-picker-menu.font-library-menu{right:auto;width:min(360px,calc(100vw - 32px));max-height:none;overflow:hidden;padding:8px}
.font-library-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;align-items:center}
.font-search-input{height:34px;min-width:0;border:1px solid #d7dbe1;border-radius:8px;padding:0 10px;background:#fff;color:#222831;font:inherit;font-size:10.5px;outline:none}
.font-search-input:focus{border-color:#9696e7;box-shadow:0 0 0 3px rgba(91,91,214,.10)}
.font-picker-menu .font-library-refresh{width:auto;height:34px;padding:0 9px;border:1px solid #d7dbe1;border-radius:8px;background:#fff;color:#4b5563;font-size:9px;font-weight:850;white-space:nowrap;justify-content:center}
.font-picker-menu .font-library-refresh:hover{background:#f5f5ff;color:#4141aa}
.font-library-tabs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;margin-top:7px;padding:3px;background:#f3f4f6;border-radius:8px}
.font-picker-menu .font-library-tabs button{width:auto;height:27px;padding:0 6px;border:0;border-radius:6px;background:transparent;color:#6b7280;font-size:9px;font-weight:800;justify-content:center}
.font-picker-menu .font-library-tabs button.active{background:#fff;color:#3434a8;box-shadow:0 1px 4px rgba(15,23,42,.08)}
.font-library-meta{height:28px;display:flex;align-items:center;justify-content:space-between;gap:8px;color:#7b8491;font-size:8.5px;padding:0 3px}
.font-library-list{height:300px;overflow:auto;border-top:1px solid #eef0f3;border-bottom:1px solid #eef0f3;overscroll-behavior:contain}
.font-option-row{height:48px;display:flex;align-items:stretch;gap:3px;border-bottom:1px solid #f2f3f5}
.font-picker-menu .font-option-main{min-width:0;flex:1;width:auto;height:47px;padding:0 7px;border:0;border-radius:6px;background:transparent;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px;text-align:left;color:#242a32}
.font-picker-menu .font-option-main:hover,.font-option-row.active .font-option-main{background:#f4f4ff;color:#3434a8}
.font-option-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;font-weight:700}
.font-picker-menu .font-option-sample{font-style:normal;font-size:14px;font-weight:400;color:#69717d;white-space:nowrap}
.font-picker-menu .font-favorite{flex:0 0 30px;width:30px;height:47px;padding:0;border:0;border-radius:6px;background:transparent;color:#a1a8b2;font-size:15px;justify-content:center}
.font-picker-menu .font-favorite:hover,.font-picker-menu .font-favorite.active{background:#fff8df;color:#b7791f}
.font-library-empty{height:300px;display:grid;place-items:center;color:#9299a3;font-size:9.5px;border-top:1px solid #eef0f3;border-bottom:1px solid #eef0f3}
.font-library-foot{padding:7px 3px 1px;color:#9aa1ab;font-size:8px;line-height:1.35}
@media(max-width:820px){.font-picker-menu.font-library-menu{position:fixed;left:12px!important;right:12px!important;top:110px;width:auto}.font-library-list,.font-library-empty{height:min(320px,45vh)}}
'''
              css.write_text(s,encoding='utf-8')

          app=Path('js/app-v3.js')
          s=app.read_text(encoding='utf-8')
          if 'const fontLibrary=' not in s:
              anchor="  const outlineFonts={faces:null,queryTried:false,uploaded:[],cache:new Map(),lastPermissionError:null};\n"
              insert=anchor+'''  const BASE_FONT_FAMILIES=['Arial','Arial Narrow','Tahoma','Verdana','Impact','sans-serif'];
  const FONT_RECENT_KEY='cg60st.font.recent';
  const FONT_FAVORITES_KEY='cg60st.font.favorites';
  const fontLibrary={families:[...BASE_FONT_FAMILIES],localCount:0,loaded:false,loading:false,error:null,mode:'all',rendered:0,chunk:120,filtered:[]};
'''
              if anchor not in s: raise SystemExit('outlineFonts anchor missing')
              s=s.replace(anchor,insert,1)

          block=r"  function setFontPickerLabel\(family\).*?\n  function initUx\(\)"
          replacement='''  function fontNorm(value){return String(value||'').normalize('NFKC').trim().toLocaleLowerCase();}
  function readFontStore(key){try{const v=JSON.parse(storageGet(key)||'[]');return Array.isArray(v)?v.filter(x=>typeof x==='string'&&x.trim()):[];}catch(_){return [];}}
  function writeFontStore(key,list){storageSet(key,JSON.stringify([...new Set(list)].slice(0,60)));}
  function fontFavorites(){return readFontStore(FONT_FAVORITES_KEY);}
  function fontRecent(){return readFontStore(FONT_RECENT_KEY);}
  function rememberFont(family){const next=[family,...fontRecent().filter(x=>fontNorm(x)!==fontNorm(family))].slice(0,12);writeFontStore(FONT_RECENT_KEY,next);}
  function toggleFavoriteFont(family){const list=fontFavorites(),key=fontNorm(family),has=list.some(x=>fontNorm(x)===key);writeFontStore(FONT_FAVORITES_KEY,has?list.filter(x=>fontNorm(x)!==key):[family,...list]);renderFontLibrary(true);}
  function ensureFontOption(family){if(!E.font)return;const exists=[...E.font.options].some(o=>o.value===family);if(!exists){const o=document.createElement('option');o.value=family;o.textContent=family==='sans-serif'?'System Sans':family;E.font.appendChild(o);}}
  function mergeFontFamilies(extra=[]){const seen=new Map();[...BASE_FONT_FAMILIES,...fontLibrary.families,...extra].forEach(f=>{const family=String(f||'').trim();if(!family)return;const key=fontNorm(family);if(!seen.has(key))seen.set(key,family);});fontLibrary.families=[...seen.values()].sort((a,b)=>a.localeCompare(b,'th',{sensitivity:'base',numeric:true}));}
  function setFontLibraryStatus(){const el=$('fontLibraryStatus');if(!el)return;if(fontLibrary.loading)el.textContent='กำลังอ่านฟอนต์ในเครื่อง…';else if(fontLibrary.error==='unsupported')el.textContent='Browser นี้ไม่รองรับ Local Font Access · ใช้ฟอนต์พื้นฐาน';else if(fontLibrary.error)el.textContent='ยังไม่ได้อนุญาตฟอนต์ในเครื่อง · กด “ฟอนต์ในเครื่อง” เพื่อลองใหม่';else if(fontLibrary.loaded)el.textContent=`ฟอนต์ในเครื่อง ${fontLibrary.localCount} แบบ · ทั้งหมด ${fontLibrary.families.length}`;else el.textContent=`ฟอนต์พื้นฐาน ${BASE_FONT_FAMILIES.length} แบบ`;}
  function currentFontFiltered(){const q=fontNorm($('fontSearchInput')?.value||''),known=new Map(fontLibrary.families.map(f=>[fontNorm(f),f]));let list;if(fontLibrary.mode==='favorites')list=fontFavorites().map(f=>known.get(fontNorm(f))).filter(Boolean);else if(fontLibrary.mode==='recent')list=fontRecent().map(f=>known.get(fontNorm(f))).filter(Boolean);else list=[...fontLibrary.families];if(q)list=list.filter(f=>fontNorm(f).includes(q));return list;}
  function renderFontLibrary(reset=false){const list=$('fontLibraryList'),empty=$('fontLibraryEmpty'),shown=$('fontLibraryShown');if(!list)return;fontLibrary.filtered=currentFontFiltered();if(reset)fontLibrary.rendered=Math.min(fontLibrary.chunk,fontLibrary.filtered.length);else fontLibrary.rendered=Math.min(Math.max(fontLibrary.rendered,fontLibrary.chunk),fontLibrary.filtered.length);const visible=fontLibrary.filtered.slice(0,fontLibrary.rendered),favorites=new Set(fontFavorites().map(fontNorm)),selected=E.font?.value;list.replaceChildren();visible.forEach(family=>{const row=document.createElement('div');row.className='font-option-row'+(family===selected?' active':'');row.dataset.fontRow=family;const main=document.createElement('button');main.type='button';main.className='font-option-main';main.dataset.fontSelect=family;main.setAttribute('role','option');main.setAttribute('aria-selected',family===selected?'true':'false');const name=document.createElement('span');name.className='font-option-name';name.textContent=family==='sans-serif'?'System Sans':family;name.style.fontFamily=family;const sample=document.createElement('em');sample.className='font-option-sample';sample.textContent='กข Aa 123';sample.style.fontFamily=family;main.append(name,sample);const fav=document.createElement('button');fav.type='button';fav.className='font-favorite'+(favorites.has(fontNorm(family))?' active':'');fav.dataset.fontFavorite=family;fav.title=favorites.has(fontNorm(family))?'เอาออกจากรายการโปรด':'เพิ่มเป็นรายการโปรด';fav.setAttribute('aria-label',fav.title);fav.textContent=favorites.has(fontNorm(family))?'★':'☆';row.append(main,fav);list.appendChild(row);});list.classList.toggle('hidden',fontLibrary.filtered.length===0);empty?.classList.toggle('hidden',fontLibrary.filtered.length!==0);if(shown)shown.textContent=fontLibrary.filtered.length?`แสดง ${visible.length}/${fontLibrary.filtered.length}`:'';$('fontPickerMenu')?.querySelectorAll('[data-font-mode]').forEach(b=>b.classList.toggle('active',b.dataset.fontMode===fontLibrary.mode));setFontLibraryStatus();}
  async function loadLocalFontLibrary(force=false){if(fontLibrary.loading)return;if(!('queryLocalFonts' in window)){fontLibrary.error='unsupported';fontLibrary.loaded=true;setFontLibraryStatus();renderFontLibrary(true);return;}fontLibrary.loading=true;fontLibrary.error=null;setFontLibraryStatus();if(force){outlineFonts.queryTried=false;outlineFonts.faces=null;outlineFonts.lastPermissionError=null;}try{const faces=await getLocalFontFaces();if(outlineFonts.lastPermissionError)throw outlineFonts.lastPermissionError;const local=[...new Map(faces.map(f=>[fontNorm(f.family),String(f.family||'').trim()]).filter(([k,v])=>k&&v)).values()];fontLibrary.localCount=local.length;mergeFontFamilies(local);fontLibrary.loaded=true;fontLibrary.error=null;}catch(e){fontLibrary.loaded=true;fontLibrary.error=e?.name||'denied';}finally{fontLibrary.loading=false;renderFontLibrary(true);}}
  function selectFontFamily(family){ensureFontOption(family);E.font.value=family;state.ui.fontPreviewFamily=null;state.ui.fontPreviewObjectId=null;rememberFont(family);setFontPickerLabel(family);E.font.dispatchEvent(new Event('change',{bubbles:true}));closeFontPicker();}
  function previewFontFamily(family){const d=activeDesign(),t=d&&textFor(d.id);if(!t)return;state.ui.fontPreviewFamily=family;state.ui.fontPreviewObjectId=t.id;renderCanvas();}
  function clearFontPreview(){if(state.ui.fontPreviewFamily){state.ui.fontPreviewFamily=null;state.ui.fontPreviewObjectId=null;renderCanvas();}}
  function setFontPickerLabel(family){if(!E.fontPickerLabel)return;E.fontPickerLabel.textContent=family==='sans-serif'?'System Sans':family;E.fontPickerLabel.style.fontFamily=family;$('fontLibraryList')?.querySelectorAll('[data-font-row]').forEach(row=>row.classList.toggle('active',row.dataset.fontRow===family));}
  function closeFontPicker(){if(!E.fontPickerMenu)return;E.fontPickerMenu.classList.add('hidden');E.fontPickerBtn?.setAttribute('aria-expanded','false');clearFontPreview();}
  function initFontPicker(){const list=$('fontLibraryList'),search=$('fontSearchInput'),refresh=$('fontRefreshBtn');renderFontLibrary(true);E.fontPickerBtn?.addEventListener('click',e=>{e.stopPropagation();const open=E.fontPickerMenu.classList.contains('hidden');closeTopMenus();E.fontPickerMenu.classList.toggle('hidden',!open);E.fontPickerBtn.setAttribute('aria-expanded',open?'true':'false');if(open){renderFontLibrary(true);requestAnimationFrame(()=>search?.focus());if(!fontLibrary.loaded&&!fontLibrary.loading)loadLocalFontLibrary(false);}else clearFontPreview();});search?.addEventListener('input',()=>renderFontLibrary(true));search?.addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();closeFontPicker();E.fontPickerBtn?.focus();}});refresh?.addEventListener('click',e=>{e.stopPropagation();loadLocalFontLibrary(true);});E.fontPickerMenu?.querySelectorAll('[data-font-mode]').forEach(b=>b.addEventListener('click',()=>{fontLibrary.mode=b.dataset.fontMode;renderFontLibrary(true);}));list?.addEventListener('scroll',()=>{if(list.scrollTop+list.clientHeight>=list.scrollHeight-70&&fontLibrary.rendered<fontLibrary.filtered.length){fontLibrary.rendered=Math.min(fontLibrary.filtered.length,fontLibrary.rendered+fontLibrary.chunk);renderFontLibrary(false);}});list?.addEventListener('pointerover',e=>{const b=e.target.closest?.('[data-font-select]');if(!b||b.contains(e.relatedTarget))return;previewFontFamily(b.dataset.fontSelect);});list?.addEventListener('pointerout',e=>{const b=e.target.closest?.('[data-font-select]');if(!b||b.contains(e.relatedTarget))return;clearFontPreview();});list?.addEventListener('click',e=>{const fav=e.target.closest?.('[data-font-favorite]');if(fav){e.preventDefault();e.stopPropagation();toggleFavoriteFont(fav.dataset.fontFavorite);return;}const pick=e.target.closest?.('[data-font-select]');if(pick)selectFontFamily(pick.dataset.fontSelect);});}
  function initUx()'''
          s2,n=re.subn(block,replacement,s,count=1,flags=re.S)
          if n!=1: raise SystemExit(f'font JS block patch count={n}')
          s=s2
          s=s.replace('fontHoverPreview:true,fileMenu:true','fontHoverPreview:true,fontLibrary:true,localFontPicker:true,fontSearch:true,fontFavorites:true,fileMenu:true',1)
          app.write_text(s,encoding='utf-8')

          test=Path('tests/v7-font-library.spec.js')
          test.write_text(r'''const { test, expect } = require('@playwright/test');

async function openWithFonts(page,{count=500,deny=false}={}){
  await page.addInitScript(({count,deny})=>{
    localStorage.clear();
    Object.defineProperty(window,'queryLocalFonts',{configurable:true,value:async()=>{
      if(deny) throw new DOMException('Local font permission denied','NotAllowedError');
      return Array.from({length:count},(_,i)=>({family:`Local Font ${String(i).padStart(4,'0')}`,fullName:`Local Font ${String(i).padStart(4,'0')} Regular`,style:'Regular',postscriptName:`LocalFont${i}-Regular`}));
    }});
  },{count,deny});
  await page.goto('http://127.0.0.1:4173/v3-preview.html');
  await page.waitForFunction(()=>Boolean(window.__StickerV3Diagnostics?.features?.fontLibrary));
  await page.click('#addItemBtn');
  await page.click('#fontPickerBtn');
}

test('font library loads hundreds of installed families, searches, favorites and remembers recent choice', async ({page})=>{
  await openWithFonts(page,{count:500});
  await expect(page.locator('#fontLibraryStatus')).toContainText('ฟอนต์ในเครื่อง 500 แบบ');
  await expect(page.locator('#fontLibraryShown')).toContainText('/506');
  await page.fill('#fontSearchInput','Local Font 0420');
  await expect(page.locator('[data-font-select="Local Font 0420"]')).toBeVisible();
  await page.click('[data-font-favorite="Local Font 0420"]');
  await page.click('[data-font-mode="favorites"]');
  await expect(page.locator('[data-font-select="Local Font 0420"]')).toBeVisible();
  await page.click('[data-font-select="Local Font 0420"]');
  await expect(page.locator('#fontFamily')).toHaveValue('Local Font 0420');
  const project=await page.evaluate(()=>window.__StickerV3Diagnostics.getProject());
  expect(project.objects.find(o=>o.type==='text')?.font?.family).toBe('Local Font 0420');
  await page.click('#fontPickerBtn');
  await page.fill('#fontSearchInput','');
  await page.click('[data-font-mode="recent"]');
  await expect(page.locator('[data-font-select="Local Font 0420"]')).toBeVisible();
});

test('font library falls back to built-ins when local font permission is denied', async ({page})=>{
  await openWithFonts(page,{deny:true});
  await expect(page.locator('#fontLibraryStatus')).toContainText('ยังไม่ได้อนุญาตฟอนต์ในเครื่อง');
  await page.fill('#fontSearchInput','Arial');
  await expect(page.locator('[data-font-select="Arial"]')).toBeVisible();
  await page.click('[data-font-select="Arial"]');
  await expect(page.locator('#fontFamily')).toHaveValue('Arial');
});
''',encoding='utf-8')
          PY

      - name: Rebuild standalone
        run: node scripts/build-v3-standalone.js

      - name: Syntax and model checks
        run: |
          node --check js/app-v3.js
          node --check tests/v7-font-library.spec.js
          node tests/model-v3.test.js
          node tests/design-ops-v3.test.js

      - name: Install browser tests
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Start server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/font-http.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/v3-preview.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/font-http.log
          exit 1

      - name: Font library regression
        run: npx playwright test tests/v7-font-library.spec.js --reporter=line --workers=1

      - name: Full production browser regression
        run: npx playwright test tests/v3-browser-smoke.spec.js tests/v3-design-behavior.spec.js tests/v3-precision.spec.js tests/v3-export.spec.js tests/v3-cutready.spec.js tests/v3-persistence.spec.js tests/v3-standalone.spec.js tests/v3-ux-redesign.spec.js tests/v4-canvas-interactions.spec.js tests/v4-paper-guides-ux.spec.js tests/v5-cad-dimensions.spec.js tests/v6-simplified-workflow.spec.js tests/v7-font-library.spec.js --reporter=line --workers=1

      - name: Standalone consistency
        run: |
          cp StickerLayout-V3-Standalone.html /tmp/standalone-font.html
          node scripts/build-v3-standalone.js
          cmp -s StickerLayout-V3-Standalone.html /tmp/standalone-font.html
          grep -q 'id="fontSearchInput"' StickerLayout-V3-Standalone.html
          grep -q 'fontLibrary:true' StickerLayout-V3-Standalone.html

      - name: Commit verified source changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html v3-preview.html css/ux-redesign.css js/app-v3.js tests/v7-font-library.spec.js StickerLayout-V3-Standalone.html
          if git diff --cached --quiet; then
            echo 'No source changes to commit'
          else
            git commit -m 'feat: add local font library with search and favorites [skip ci]'
            git push origin HEAD:v7-local-font-library
          fi
