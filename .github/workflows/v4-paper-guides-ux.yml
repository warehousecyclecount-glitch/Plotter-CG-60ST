name: Verify V4 Paper Guides UX

on:
  push:
    branches:
      - v4-paper-guides-ux
    paths:
      - .github/workflows/v4-paper-guides-ux.yml
      - scripts/apply-v4-paper-guides-ux.py

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v4-paper-guides-ux
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Apply requested UX changes
        run: python3 scripts/apply-v4-paper-guides-ux.py

      - name: Rebuild standalone
        run: node scripts/build-v3-standalone.js

      - name: Syntax and model checks
        run: |
          node --check js/model-v3.js
          node --check js/design-ops-v3.js
          node --check js/app-v3.js
          node --check tests/v4-paper-guides-ux.spec.js
          node tests/model-v3.test.js
          node tests/design-ops-v3.test.js

      - name: Install Chromium
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Start server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/v4-paper-http.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/v3-preview.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/v4-paper-http.log
          exit 1

      - name: Requested behavior regressions
        run: npx playwright test tests/v4-paper-guides-ux.spec.js --reporter=line --workers=1

      - name: Full production browser regression
        run: npx playwright test tests/v3-browser-smoke.spec.js tests/v3-design-behavior.spec.js tests/v3-precision.spec.js tests/v3-export.spec.js tests/v3-cutready.spec.js tests/v3-persistence.spec.js tests/v3-standalone.spec.js tests/v3-ux-redesign.spec.js tests/v4-canvas-interactions.spec.js tests/v4-paper-guides-ux.spec.js --reporter=line --workers=1

      - name: Standalone consistency
        run: |
          cp StickerLayout-V3-Standalone.html /tmp/standalone-after-build.html
          node scripts/build-v3-standalone.js
          cmp -s StickerLayout-V3-Standalone.html /tmp/standalone-after-build.html
          grep -q 'guideMeasure:true' StickerLayout-V3-Standalone.html
          grep -q 'paperAutoFit:true' StickerLayout-V3-Standalone.html
          grep -q 'id="guideMeasureBtn"' StickerLayout-V3-Standalone.html

      - name: Commit verified changes
        run: |
          rm -rf node_modules test-results
          rm -f package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html v3-preview.html js/model-v3.js js/app-v3.js css/ux-redesign.css css/canvas-v4.css tests/model-v3.test.js tests/v4-paper-guides-ux.spec.js .github/workflows/v3-ci.yml StickerLayout-V3-Standalone.html
          if git diff --cached --quiet; then
            echo 'No requested changes to commit'
            exit 1
          fi
          git commit -m "feat: improve paper workspace guides and shortcuts [skip ci]"
          git push origin HEAD:v4-paper-guides-ux
