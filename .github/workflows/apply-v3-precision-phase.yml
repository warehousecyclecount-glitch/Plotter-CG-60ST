name: Apply V3 Precision Phase

on:
  push:
    branches:
      - v3-foundation
    paths:
      - '.github/workflows/apply-v3-precision-phase.yml'

permissions:
  contents: write

jobs:
  publish-verified-batch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout verified branch state
        uses: actions/checkout@v4
        with:
          ref: v3-foundation
          fetch-depth: 0

      - name: Apply the already-tested precision batch
        run: |
          python3 scripts/apply-v3-precision-phase.py
          python3 scripts/fix-v3-precision-test.py

      - name: Keep workflow metadata out of the app commit
        run: |
          git restore .github/workflows/v3-ci.yml
          rm -rf node_modules test-results
          rm -f package-lock.json
          rm -f scripts/apply-v3-precision-phase.py
          rm -f scripts/fix-v3-precision-test.py

      - name: Verify clean publish scope
        run: |
          node --check js/app-v3.js
          git diff --check
          test -f tests/v3-precision.spec.js
          if git status --short | grep -E 'node_modules|test-results'; then
            echo 'Generated test dependencies must not be committed'
            exit 1
          fi

      - name: Commit verified precision phase
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app-v3.js v3-preview.html css/v3-preview.css tests/v3-precision.spec.js docs/V3-INTEGRATION.md scripts/apply-v3-precision-phase.py scripts/fix-v3-precision-test.py
          if git diff --cached --quiet; then
            echo "No verified application changes to commit"
            exit 1
          fi
          git commit -m "feat: add V3 precision controls and snapping [skip ci]"
          git push origin HEAD:v3-foundation
