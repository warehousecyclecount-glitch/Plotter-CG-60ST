name: Apply V3 Precision Phase

on:
  push:
    branches:
      - v3-foundation
    paths:
      - '.github/workflows/apply-v3-precision-phase.yml'
      - 'scripts/apply-v3-precision-phase.py'

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: v3-foundation
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Apply full precision phase
        run: python3 scripts/apply-v3-precision-phase.py

      - name: Syntax checks
        run: |
          node --check js/model-v3.js
          node --check js/design-ops-v3.js
          node --check js/app-v3.js

      - name: Run model and geometry regression
        run: |
          node tests/model-v3.test.js
          node tests/design-ops-v3.test.js

      - name: Install Playwright test runner
        run: npm install --no-save @playwright/test@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/v3-http.log 2>&1 &
          echo $! > /tmp/v3-http.pid
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/v3-preview.html >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/v3-http.log
          exit 1

      - name: Run browser regression once at the end
        run: npx playwright test tests/v3-browser-smoke.spec.js tests/v3-design-behavior.spec.js tests/v3-precision.spec.js --reporter=line --workers=1

      - name: Remove temporary apply files
        run: |
          rm -f scripts/apply-v3-precision-phase.py
          rm -f .github/workflows/apply-v3-precision-phase.yml

      - name: Commit verified precision phase
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 1
          fi
          git commit -m "feat: add V3 precision controls and snapping [skip ci]"
          git push origin HEAD:v3-foundation
