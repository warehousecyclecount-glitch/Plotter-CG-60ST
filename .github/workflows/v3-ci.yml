name: Production CI

on:
  push:
    branches:
      - main
      - v3-foundation
      - v3-final
      - v3-ux-redesign
      - v4-canvas-interactions
      - v4-ci-hardening
  pull_request:
    branches:
      - main

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Syntax checks
        run: |
          node --check js/model-v3.js
          node --check js/design-ops-v3.js
          node --check js/app-v3.js
          node --check scripts/build-v3-standalone.js
          node --check tests/v3-export.spec.js
          node --check tests/v3-cutready.spec.js
          node --check tests/v3-persistence.spec.js
          node --check tests/v3-standalone.spec.js
          node --check tests/v3-ux-redesign.spec.js
          node --check tests/v4-canvas-interactions.spec.js
          node --check tests/v4-paper-guides-ux.spec.js
          node --check tests/v5-cad-dimensions.spec.js
          node --check tests/v6-simplified-workflow.spec.js
          node --check tests/v7-font-library.spec.js

      - name: Run model regression tests
        run: node tests/model-v3.test.js

      - name: Run design geometry tests
        run: node tests/design-ops-v3.test.js

      - name: Verify production and preview runtime wiring
        run: |
          test -s js/vendor/opentype.min.js
          test -s js/vendor/opentype.LICENSE.txt
          grep -q 'js/vendor/opentype.min.js' v3-preview.html
          grep -q 'js/model-v3.js' v3-preview.html
          grep -q 'js/design-ops-v3.js' v3-preview.html
          grep -q 'js/app-v3.js' v3-preview.html
          grep -q 'css/v3-preview.css' v3-preview.html
          grep -q 'css/ux-redesign.css' v3-preview.html
          grep -q 'css/canvas-v4.css' v3-preview.html
          grep -q 'js/vendor/opentype.min.js' index.html
          grep -q 'js/model-v3.js' index.html
          grep -q 'js/design-ops-v3.js' index.html
          grep -q 'js/app-v3.js' index.html
          grep -q 'css/ux-redesign.css' index.html
          grep -q 'css/canvas-v4.css' index.html
          grep -q 'id="fileMenuBtn"' index.html
          grep -q 'id="newProjectBtn"' index.html
          grep -q 'id="openProjectBtn"' index.html
          grep -q 'id="preflightBtn"' index.html
          grep -q 'ส่งไปตัด' index.html
          grep -q 'id="leftPanelResizer"' index.html
          grep -q 'id="rightPanelResizer"' index.html
          grep -q 'id="leftPanelCollapseBtn"' index.html
          grep -q 'id="rightPanelCollapseBtn"' index.html
          grep -q 'id="guideMeasureBtn"' index.html
          grep -q 'id="canvasStage"' index.html
          grep -q 'id="fontPickerMenu"' index.html
          grep -q 'id="fontSearchInput"' index.html
          grep -q 'id="fontLibraryList"' index.html
          grep -q 'id="floatingToolbar"' index.html
          grep -q 'id="canvasContextMenu"' index.html
          grep -q 'id="rulerHorizontal"' index.html
          grep -q 'cutReadyPathExport:true' js/app-v3.js
          grep -q 'uxRedesign:true' js/app-v3.js
          grep -q 'middleMousePan:true' js/app-v3.js
          grep -q 'fontHoverPreview:true' js/app-v3.js
          grep -q 'fontLibrary:true' js/app-v3.js
          grep -q 'localFontPicker:true' js/app-v3.js
          grep -q 'fontSearch:true' js/app-v3.js
          grep -q 'fontFavorites:true' js/app-v3.js
          grep -q 'emptyProject:true' js/app-v3.js
          grep -q 'eightPointResize:true' js/app-v3.js
          grep -q 'multiSelect:true' js/app-v3.js
          grep -q 'contextMenu:true' js/app-v3.js
          grep -q 'floatingToolbar:true' js/app-v3.js
          grep -q 'rulers:true' js/app-v3.js
          grep -q 'userGuides:true' js/app-v3.js
          grep -q 'guideMeasure:true' js/app-v3.js
          grep -q 'paperAutoFit:true' js/app-v3.js
          grep -q 'smartDimensions:true' js/app-v3.js
          grep -q 'simpleWorkflow:true' js/app-v3.js
          grep -q 'autoPreflightOnSend:true' js/app-v3.js
          if grep -q 'id="exportMenuBtn"' index.html; then
            echo 'Production header must not expose the legacy export menu'
            exit 1
          fi
          if grep -q 'WAREHOUSE' js/app-v3.js; then
            echo 'Production runtime must not seed demo WAREHOUSE content'
            exit 1
          fi
          if grep -q 'ต้องมีอย่างน้อย 1 ชิ้นงาน' js/app-v3.js; then
            echo 'Production runtime must allow an empty project'
            exit 1
          fi
          if grep -q 'js/app-v2.js' v3-preview.html; then
            echo 'v3-preview.html must not load app-v2.js'
            exit 1
          fi
          if grep -q 'js/app-v2.js' index.html; then
            echo 'production index.html must not load app-v2.js'
            exit 1
          fi

      - name: Verify generated standalone is current
        run: |
          cp StickerLayout-V3-Standalone.html /tmp/standalone-before.html
          node scripts/build-v3-standalone.js
          cmp -s StickerLayout-V3-Standalone.html /tmp/standalone-before.html || {
            echo 'StickerLayout-V3-Standalone.html is out of sync with production source'
            exit 1
          }
          grep -q 'ไฟล์พร้อมตัด' StickerLayout-V3-Standalone.html
          grep -q 'ส่งไปตัด' StickerLayout-V3-Standalone.html
          grep -q 'cutReadyPathExport:true' StickerLayout-V3-Standalone.html
          grep -q 'uxRedesign:true' StickerLayout-V3-Standalone.html
          grep -q 'floatingToolbar:true' StickerLayout-V3-Standalone.html
          grep -q 'eightPointResize:true' StickerLayout-V3-Standalone.html
          grep -q 'guideMeasure:true' StickerLayout-V3-Standalone.html
          grep -q 'paperAutoFit:true' StickerLayout-V3-Standalone.html
          grep -q 'smartDimensions:true' StickerLayout-V3-Standalone.html
          grep -q 'simpleWorkflow:true' StickerLayout-V3-Standalone.html
          grep -q 'fontLibrary:true' StickerLayout-V3-Standalone.html
          grep -q 'localFontPicker:true' StickerLayout-V3-Standalone.html
          grep -q 'id="fontSearchInput"' StickerLayout-V3-Standalone.html
          grep -q 'id="fontLibraryList"' StickerLayout-V3-Standalone.html
          grep -q 'id="guideMeasureBtn"' StickerLayout-V3-Standalone.html
          if grep -q 'id="exportMenuBtn"' StickerLayout-V3-Standalone.html; then
            echo 'Standalone must use the simplified send-to-cut workflow'
            exit 1
          fi
          if grep -Eq 'src="js/|href="css/' StickerLayout-V3-Standalone.html; then
            echo 'Standalone still has external project CSS/JS dependency'
            exit 1
          fi

  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Playwright test runner
        run: npm install --no-save @playwright/test@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/production-http.log 2>&1 &
          echo $! > /tmp/production-http.pid
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/v3-preview.html >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/production-http.log
          exit 1

      - name: Run full production browser suite
        run: npx playwright test tests/v3-browser-smoke.spec.js tests/v3-design-behavior.spec.js tests/v3-precision.spec.js tests/v3-export.spec.js tests/v3-cutready.spec.js tests/v3-persistence.spec.js tests/v3-standalone.spec.js tests/v3-ux-redesign.spec.js tests/v4-canvas-interactions.spec.js tests/v4-paper-guides-ux.spec.js tests/v5-cad-dimensions.spec.js tests/v6-simplified-workflow.spec.js tests/v7-font-library.spec.js --reporter=line --workers=1
