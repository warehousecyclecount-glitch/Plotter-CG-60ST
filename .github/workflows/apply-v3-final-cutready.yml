name: Apply V3 Final Cut Ready

on:
  push:
    branches:
      - v3-final
    paths:
      - '.github/workflows/apply-v3-final-cutready.yml'
      - 'scripts/apply-v3-final-cutready.js'

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: v3-final
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install OpenType and Playwright
        run: npm install --no-save opentype.js@1.3.4 @playwright/test@1.55.0

      - name: Vendor OpenType runtime and license
        run: |
          mkdir -p js/vendor
          cp node_modules/opentype.js/dist/opentype.min.js js/vendor/opentype.min.js
          cp node_modules/opentype.js/LICENSE js/vendor/opentype.LICENSE.txt

      - name: Repair generated patch source quoting
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/apply-v3-final-cutready.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("toast(`อ่านฟอนต์แล้ว ${count} ไฟล์`)", "toast('อ่านฟอนต์แล้ว '+count+' ไฟล์')")
          marker="const cutReadyFunctions = String.raw`"
          start=s.index(marker)+len(marker)
          end=s.index("\n`;\napp=replaceOnce(app,`  function buildCalibrationSvg(){", start)
          body=s[start:end]
          body=body.replace('`','\\`').replace('${','\\${')
          s=s[:start]+body+s[end:]
          p.write_text(s,encoding='utf-8')
          PY
          node --check scripts/apply-v3-final-cutready.js

      - name: Apply final Cut Ready implementation
        run: node scripts/apply-v3-final-cutready.js

      - name: Build standalone from final source
        run: node scripts/build-v3-standalone.js

      - name: Syntax and model regression
        run: |
          node --check js/model-v3.js
          node --check js/design-ops-v3.js
          node --check js/app-v3.js
          node --check scripts/build-v3-standalone.js
          node --check tests/v3-cutready.spec.js
          node tests/model-v3.test.js
          node tests/design-ops-v3.test.js

      - name: Verify runtime wiring
        run: |
          grep -q 'js/vendor/opentype.min.js' index.html
          grep -q 'js/vendor/opentype.min.js' v3-preview.html
          grep -q 'js/app-v3.js' index.html
          grep -q 'ไฟล์พร้อมตัด' index.html
          grep -q 'data-kind="text-path"' js/app-v3.js
          if grep -Eq 'src="js/|href="css/' StickerLayout-V3-Standalone.html; then
            echo 'Standalone still has external project CSS/JS dependency'
            exit 1
          fi

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/v3-http.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/v3-preview.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/v3-http.log
          exit 1

      - name: Run full final browser suite
        run: npx playwright test tests/v3-browser-smoke.spec.js tests/v3-design-behavior.spec.js tests/v3-precision.spec.js tests/v3-export.spec.js tests/v3-persistence.spec.js tests/v3-standalone.spec.js tests/v3-cutready.spec.js --reporter=line --workers=1

      - name: Clean temporary dependencies
        run: |
          rm -rf node_modules test-results
          rm -f package-lock.json
          rm -f scripts/apply-v3-final-cutready.js

      - name: Commit verified Final changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html v3-preview.html css/v3-preview.css js/app-v3.js js/vendor/opentype.min.js js/vendor/opentype.LICENSE.txt scripts/build-v3-standalone.js StickerLayout-V3-Standalone.html tests/v3-cutready.spec.js README.md scripts/apply-v3-final-cutready.js
          git commit -m "feat: complete Cut Ready Curve Path export [skip ci]"
          git push origin HEAD:v3-final
