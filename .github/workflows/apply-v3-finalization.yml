name: Apply V3 Finalization

on:
  push:
    branches:
      - v3-foundation
    paths:
      - '.github/workflows/apply-v3-finalization.yml'
      - 'scripts/apply-v3-finalization.py'

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: v3-foundation
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Apply finalization phase
        run: python3 scripts/apply-v3-finalization.py

      - name: Build V3 standalone
        run: node scripts/build-v3-standalone.js

      - name: Syntax checks
        run: |
          node --check js/model-v3.js
          node --check js/design-ops-v3.js
          node --check js/app-v3.js
          node --check scripts/build-v3-standalone.js
          node --check tests/v3-persistence.spec.js
          node --check tests/v3-standalone.spec.js
          node --check tests/v3-export.spec.js

      - name: Run model and geometry regression
        run: |
          node tests/model-v3.test.js
          node tests/design-ops-v3.test.js

      - name: Verify standalone has no CSS or JS file dependency
        run: |
          if grep -Eq 'src="js/|href="css/' StickerLayout-V3-Standalone.html; then
            echo 'Standalone still has external project CSS/JS dependency'
            exit 1
          fi
          grep -q '__StickerV3Diagnostics' StickerLayout-V3-Standalone.html
          grep -q 'id="saveProjectBtn"' StickerLayout-V3-Standalone.html

      - name: Install Playwright test runner
        run: npm install --no-save @playwright/test@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/v3-http.log 2>&1 &
          echo $! > /tmp/v3-http.pid
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/v3-preview.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/v3-http.log
          exit 1

      - name: Run full browser regression at the end
        run: npx playwright test tests/v3-browser-smoke.spec.js tests/v3-design-behavior.spec.js tests/v3-precision.spec.js tests/v3-export.spec.js tests/v3-persistence.spec.js tests/v3-standalone.spec.js --reporter=line --workers=1

      - name: Clean generated test dependencies
        run: |
          rm -rf node_modules test-results
          rm -f package-lock.json
          rm -f scripts/apply-v3-finalization.py

      - name: Commit verified finalization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app-v3.js v3-preview.html css/v3-preview.css README.md docs/V3-INTEGRATION.md docs/V3-USER-ACCEPTANCE.md scripts/build-v3-standalone.js StickerLayout-V3-Standalone.html tests/v3-export.spec.js tests/v3-persistence.spec.js tests/v3-standalone.spec.js scripts/apply-v3-finalization.py
          if git diff --cached --quiet; then
            echo "No verified finalization changes to commit"
            exit 1
          fi
          git commit -m "feat: finalize V3 persistence and standalone [skip ci]"
          git push origin HEAD:v3-foundation
