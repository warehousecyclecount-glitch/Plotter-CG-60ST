name: Apply V3 Independent Frame Phase

on:
  push:
    branches:
      - v3-foundation
    paths:
      - '.github/workflows/apply-v3-frame-phase.yml'
      - 'scripts/apply-v3-frame-phase.cjs'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: v3-foundation
          fetch-depth: 0

      - name: Apply deterministic editor patch
        run: node scripts/apply-v3-frame-phase.cjs

      - name: Syntax check patched editor
        run: node --check js/app-v3.js

      - name: Run model regression
        run: node tests/model-v3.test.js

      - name: Commit patched editor
        run: |
          if git diff --quiet -- js/app-v3.js; then
            echo 'No editor changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/app-v3.js
          git commit -m 'feat: add independent frame workflow to V3 preview'
          git push origin HEAD:v3-foundation
