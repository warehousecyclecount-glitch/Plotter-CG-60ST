name: Verify V4 Pointer Hotfix

on:
  push:
    branches:
      - v4-interaction-hotfix
    paths:
      - .github/workflows/hotfix-v4-pointer.yml
      - scripts/hotfix-v4-pointer.py
      - tests/v4-pointer-debug.spec.js

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v4-interaction-hotfix
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply hotfix candidate
        run: python3 scripts/hotfix-v4-pointer.py
      - name: Rebuild standalone
        run: node scripts/build-v3-standalone.js
      - name: Syntax and model checks
        run: |
          node --check js/model-v3.js
          node --check js/design-ops-v3.js
          node --check js/app-v3.js
          node --check scripts/build-v3-standalone.js
          node tests/model-v3.test.js
          node tests/design-ops-v3.test.js
      - name: Install Chromium
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Start server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/hotfix-http.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/v3-preview.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/hotfix-http.log
          exit 1
      - name: Pointer diagnostics
        run: npx playwright test tests/v4-pointer-debug.spec.js --reporter=line --workers=1
      - name: Focused regressions
        run: npx playwright test tests/v3-design-behavior.spec.js tests/v3-precision.spec.js --reporter=line --workers=1
      - name: Full browser regression
        run: npx playwright test tests/v3-browser-smoke.spec.js tests/v3-design-behavior.spec.js tests/v3-precision.spec.js tests/v3-export.spec.js tests/v3-cutready.spec.js tests/v3-persistence.spec.js tests/v3-standalone.spec.js tests/v3-ux-redesign.spec.js tests/v4-canvas-interactions.spec.js --reporter=line --workers=1
      - name: Standalone consistency
        run: |
          if grep -q 'class="frame-hit"' StickerLayout-V3-Standalone.html; then
            echo 'Standalone still contains obsolete frame-hit target'
            exit 1
          fi
          grep -q 'function updateFloatingToolbar' StickerLayout-V3-Standalone.html
          grep -q 'placementVisualRect' StickerLayout-V3-Standalone.html
      - name: Commit verified hotfix
        run: |
          rm -rf node_modules test-results
          rm -f package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app-v3.js css/canvas-v4.css StickerLayout-V3-Standalone.html
          if git diff --cached --quiet; then
            echo 'No runtime changes to commit'
            exit 1
          fi
          git commit -m "fix: keep V4 controls out of frame interaction area [skip ci]"
          git push origin HEAD:v4-interaction-hotfix
