name: Verify V4 Pointer Hotfix

on:
  push:
    branches:
      - v4-interaction-hotfix
    paths:
      - '.github/workflows/hotfix-v4-pointer.yml'

permissions:
  contents: write

jobs:
  hotfix-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v4
        with:
          ref: v4-interaction-hotfix
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Apply pointer hit-target fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('js/app-v3.js')
          s = p.read_text(encoding='utf-8')
          old = 'return rotGroup(visible+hit,t.rotation,t.x+o.size.w/2,t.y+o.size.h/2);'
          new = 'return rotGroup(hit+visible,t.rotation,t.x+o.size.w/2,t.y+o.size.h/2);'
          if old not in s:
              raise SystemExit('frame hit ordering target not found')
          s = s.replace(old, new, 1)
          old = "const target=e.target.closest?.('.job-text,.frame-shape');"
          new = "const target=e.target.closest?.('.job-text,.frame-shape,.frame-hit');"
          if old not in s:
              raise SystemExit('context target selector not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Rebuild standalone
        run: node scripts/build-v3-standalone.js

      - name: Syntax checks
        run: |
          node --check js/model-v3.js
          node --check js/design-ops-v3.js
          node --check js/app-v3.js
          node --check scripts/build-v3-standalone.js
          node --check tests/v4-canvas-interactions.spec.js

      - name: Run model and geometry regression
        run: |
          node tests/model-v3.test.js
          node tests/design-ops-v3.test.js

      - name: Install Playwright
        run: npm install --no-save @playwright/test@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/v4-hotfix-http.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/v3-preview.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/v4-hotfix-http.log
          exit 1

      - name: Run full production browser suite
        run: npx playwright test tests/v3-browser-smoke.spec.js tests/v3-design-behavior.spec.js tests/v3-precision.spec.js tests/v3-export.spec.js tests/v3-cutready.spec.js tests/v3-persistence.spec.js tests/v3-standalone.spec.js tests/v3-ux-redesign.spec.js tests/v4-canvas-interactions.spec.js --reporter=line --workers=1

      - name: Verify standalone contains hotfix
        run: |
          grep -q 'return rotGroup(hit+visible' StickerLayout-V3-Standalone.html
          grep -q "job-text,.frame-shape,.frame-hit" StickerLayout-V3-Standalone.html

      - name: Cleanup test runtime
        run: |
          rm -rf node_modules test-results
          rm -f package-lock.json

      - name: Commit verified hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app-v3.js StickerLayout-V3-Standalone.html
          git commit -m "fix: correct V4 frame pointer hit ordering [skip ci]"
          git push origin HEAD:v4-interaction-hotfix
