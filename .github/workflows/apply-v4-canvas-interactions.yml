name: Apply V4 Canvas Interactions

on:
  push:
    branches:
      - v4-canvas-interactions
    paths:
      - '.github/workflows/apply-v4-canvas-interactions.yml'
      - 'scripts/apply-v4-canvas-interactions.py'

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: v4-canvas-interactions
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Apply V4 patch
        run: python3 scripts/apply-v4-canvas-interactions.py

      - name: Fix test helper names and standalone builder
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('tests/model-v3.test.js')
          s=p.read_text()
          s=s.replace("run('V4 workspace guides", "test('V4 workspace guides")
          p.write_text(s)

          p=Path('tests/design-ops-v3.test.js')
          s=p.read_text()
          s=s.replace("run('V4 edge handles", "test('V4 edge handles")
          s=s.replace("near(pl.transforms[frame.id].x+90, centers[i].x); near(pl.transforms[frame.id].y+45, centers[i].y);", "assert.ok(Math.abs((pl.transforms[frame.id].x+90)-centers[i].x)<1e-8); assert.ok(Math.abs((pl.transforms[frame.id].y+45)-centers[i].y)<1e-8);")
          p.write_text(s)

          p=Path('scripts/build-v3-standalone.js')
          s=p.read_text()
          s=s.replace("['css/app.css','css/enhancements.css','css/v3-preview.css','css/ux-redesign.css']", "['css/app.css','css/enhancements.css','css/v3-preview.css','css/ux-redesign.css','css/canvas-v4.css']")
          s=s.replace(".replace(/\\s*<link rel=\"stylesheet\" href=\"css\\/ux-redesign\\.css\">/, '')", ".replace(/\\s*<link rel=\"stylesheet\" href=\"css\\/ux-redesign\\.css\">/, '')\n  .replace(/\\s*<link rel=\"stylesheet\" href=\"css\\/canvas-v4\\.css\">/, '')")
          p.write_text(s)
          PY

      - name: Build standalone from source
        run: node scripts/build-v3-standalone.js

      - name: Syntax checks
        run: |
          python3 -m py_compile scripts/apply-v4-canvas-interactions.py
          node --check js/model-v3.js
          node --check js/design-ops-v3.js
          node --check js/app-v3.js
          node --check tests/v4-canvas-interactions.spec.js
          node --check scripts/build-v3-standalone.js

      - name: Run model and geometry regression
        run: |
          node tests/model-v3.test.js
          node tests/design-ops-v3.test.js

      - name: Install Playwright
        run: npm install --no-save @playwright/test@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/v4-http.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/v3-preview.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/v4-http.log
          exit 1

      - name: Run complete browser suite once at the end
        run: npx playwright test tests/v3-browser-smoke.spec.js tests/v3-design-behavior.spec.js tests/v3-precision.spec.js tests/v3-export.spec.js tests/v3-cutready.spec.js tests/v3-persistence.spec.js tests/v3-standalone.spec.js tests/v3-ux-redesign.spec.js tests/v4-canvas-interactions.spec.js --reporter=line --workers=1

      - name: Cleanup temporary apply files
        run: |
          rm -rf node_modules test-results
          rm -f package-lock.json
          rm -f scripts/apply-v4-canvas-interactions.py
          rm -f .github/workflows/apply-v4-canvas-interactions.yml

      - name: Commit verified V4 upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add professional canvas interactions V4 [skip ci]"
          git push origin HEAD:v4-canvas-interactions
