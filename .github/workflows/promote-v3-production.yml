name: Promote V3 Production

on:
  push:
    branches:
      - v3-foundation
    paths:
      - '.github/workflows/promote-v3-production.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: v3-foundation
          fetch-depth: 0

      - name: Wire V3 to production entrypoint
        run: |
          cp v3-preview.html index.html
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace(' · V3 Preview', '')
          s = s.replace('V3 Preview', 'Production')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Update production documentation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          s = p.read_text(encoding='utf-8')
          s = s.replace('`main` ยังใช้ V2 และยังไม่ถูกเปลี่ยน จนกว่าจะผ่านการทดสอบจริงกับ CorelDRAW / FineCut / CG-60ST\n\nV3 Release Candidate อยู่ที่ branch `v3-foundation` และหน้า `v3-preview.html`', '`main` ใช้ V3 เป็น Production runtime แล้ว โดย GitHub Pages เปิดจาก `index.html`\n\nbranch `v3-foundation` ยังคงเป็นสายพัฒนาสำหรับตรวจสอบย้อนหลังและการแก้ไขต่อไป')
          s = s.replace('จนกว่าจะผ่าน checklist นี้ จะยังไม่ Promote V3 เข้า `main`', 'V3 ถูก Deploy เข้า `main` แล้ว แต่ Compatibility กับ CorelDRAW / FineCut / CG-60ST จริงยังต้องยืนยันจากเครื่องใช้งานจริงตาม checklist นี้')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Syntax and model checks
        run: |
          node --check js/model-v3.js
          node --check js/design-ops-v3.js
          node --check js/app-v3.js
          node tests/model-v3.test.js
          node tests/design-ops-v3.test.js
          grep -q 'js/model-v3.js' index.html
          grep -q 'js/design-ops-v3.js' index.html
          grep -q 'js/app-v3.js' index.html
          grep -q 'css/v3-preview.css' index.html
          if grep -q 'js/app-v2.js' index.html; then exit 1; fi

      - name: Install Playwright
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Start server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/v3-http.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/v3-http.log
          exit 1

      - name: Run full release suite
        run: npx playwright test tests/v3-browser-smoke.spec.js tests/v3-design-behavior.spec.js tests/v3-precision.spec.js tests/v3-export.spec.js tests/v3-persistence.spec.js tests/v3-standalone.spec.js --reporter=line --workers=1

      - name: Commit production wiring
        run: |
          rm -rf node_modules test-results
          rm -f package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html README.md
          git commit -m "release: promote V3 to production entrypoint [skip ci]"
          git push origin HEAD:v3-foundation
