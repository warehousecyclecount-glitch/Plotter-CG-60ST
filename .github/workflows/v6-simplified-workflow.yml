name: Verify V6 Simplified Workflow

on:
  push:
    branches:
      - v6-simplified-workflow

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: v6-simplified-workflow
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Apply V6 UX changes
        run: python3 scripts/apply-v6-simplified-workflow.py

      - name: Rebuild standalone
        run: node scripts/build-v3-standalone.js

      - name: Syntax and model checks
        run: |
          node --check js/model-v3.js
          node --check js/design-ops-v3.js
          node --check js/app-v3.js
          node --check tests/v3-export.spec.js
          node --check tests/v3-cutready.spec.js
          node --check tests/v3-ux-redesign.spec.js
          node --check tests/v5-cad-dimensions.spec.js
          node --check tests/v6-simplified-workflow.spec.js
          node tests/model-v3.test.js
          node tests/design-ops-v3.test.js

      - name: Install browser tests
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Start server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/v6-http.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/v3-preview.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/v6-http.log
          exit 1

      - name: V6 requested regression
        run: npx playwright test tests/v6-simplified-workflow.spec.js --reporter=line --workers=1

      - name: Full production browser regression
        run: npx playwright test tests/v3-browser-smoke.spec.js tests/v3-design-behavior.spec.js tests/v3-precision.spec.js tests/v3-export.spec.js tests/v3-cutready.spec.js tests/v3-persistence.spec.js tests/v3-standalone.spec.js tests/v3-ux-redesign.spec.js tests/v4-canvas-interactions.spec.js tests/v4-paper-guides-ux.spec.js tests/v5-cad-dimensions.spec.js tests/v6-simplified-workflow.spec.js --reporter=line --workers=1

      - name: Standalone consistency
        run: |
          cp StickerLayout-V3-Standalone.html /tmp/standalone-v6.html
          node scripts/build-v3-standalone.js
          cmp -s StickerLayout-V3-Standalone.html /tmp/standalone-v6.html
          grep -q 'ส่งไปตัด' StickerLayout-V3-Standalone.html
          grep -q 'simpleWorkflow:true' StickerLayout-V3-Standalone.html

      - name: Commit verified source changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html v3-preview.html css/ux-redesign.css css/v3-preview.css js/app-v3.js tests/v3-ux-redesign.spec.js tests/v3-export.spec.js tests/v3-cutready.spec.js tests/v6-simplified-workflow.spec.js .github/workflows/v3-ci.yml StickerLayout-V3-Standalone.html
          if git diff --cached --quiet; then
            echo 'No generated changes to commit'
          else
            git commit -m 'feat: simplify workflow to start, design, and send to cut [skip ci]'
            git push origin HEAD:v6-simplified-workflow
          fi
