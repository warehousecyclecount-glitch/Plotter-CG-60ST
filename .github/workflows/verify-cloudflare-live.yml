name: Verify Cloudflare Live

on:
  push:
    branches:
      - v3-ux-redesign
    paths:
      - '.github/workflows/verify-cloudflare-live.yml'

jobs:
  verify-live:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Cloudflare Pages production
        run: |
          set -e
          URL='https://plotter-cg-60st.pages.dev/'
          for i in $(seq 1 30); do
            echo "Cloudflare check $i/30"
            body="$(curl -fsSL --retry 2 --connect-timeout 10 "$URL" || true)"
            if printf '%s' "$body" | grep -q 'id="fileMenuBtn"' \
              && printf '%s' "$body" | grep -q 'id="exportMenuBtn"' \
              && printf '%s' "$body" | grep -q 'id="canvasStage"' \
              && printf '%s' "$body" | grep -q 'css/ux-redesign.css'; then
              echo 'CLOUDFLARE_LIVE_VERIFIED'
              exit 0
            fi
            sleep 10
          done
          echo 'Cloudflare production did not reflect the merged UX within 5 minutes.'
          exit 1
