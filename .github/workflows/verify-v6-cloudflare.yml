name: Verify V7 Cloudflare Deployment

on:
  push:
    branches:
      - verify-v6-cloudflare

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check production markers
        run: |
          set -euo pipefail
          base='https://plotter-cg-60st.pages.dev'
          for i in {1..20}; do
            if curl -fsSL --max-time 20 "$base/" -o /tmp/index.html && \
               curl -fsSL --max-time 20 "$base/js/app-v3.js" -o /tmp/app.js; then
              if grep -q 'id="fontSearchInput"' /tmp/index.html && \
                 grep -q 'id="fontLibraryList"' /tmp/index.html && \
                 grep -q 'fontLibrary:true' /tmp/app.js && \
                 grep -q 'localFontPicker:true' /tmp/app.js && \
                 grep -q 'fontSearch:true' /tmp/app.js && \
                 grep -q 'fontFavorites:true' /tmp/app.js; then
                echo 'V7 local font library verified on Cloudflare production'
                exit 0
              fi
            fi
            echo "Waiting for Cloudflare production deploy ($i/20)..."
            sleep 5
          done
          echo 'V7 font library markers not found on Cloudflare production within verification window'
          exit 1
