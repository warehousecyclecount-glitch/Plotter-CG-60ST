name: Apply V3 Design Behavior

on:
  push:
    branches:
      - v3-foundation
    paths:
      - '.github/workflows/apply-v3-design-behavior.yml'
      - 'scripts/apply-v3-design-behavior.cjs'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: v3-foundation
          fetch-depth: 0

      - name: Apply reviewed V3 design behavior patch
        run: node scripts/apply-v3-design-behavior.cjs

      - name: Syntax checks
        run: |
          node --check js/model-v3.js
          node --check js/design-ops-v3.js
          node --check js/app-v3.js

      - name: Run regression tests
        run: |
          node tests/model-v3.test.js
          node tests/design-ops-v3.test.js

      - name: Verify preview wiring
        run: |
          grep -q 'js/model-v3.js' v3-preview.html
          grep -q 'js/design-ops-v3.js' v3-preview.html
          grep -q 'js/app-v3.js' v3-preview.html
          grep -q 'centerTextBtn' v3-preview.html

      - name: Commit integrated editor
        run: |
          if git diff --quiet -- js/app-v3.js v3-preview.html; then
            echo 'No integration changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/app-v3.js v3-preview.html
          git commit -m 'feat: integrate V3 set behavior into preview editor'
          git push origin HEAD:v3-foundation
