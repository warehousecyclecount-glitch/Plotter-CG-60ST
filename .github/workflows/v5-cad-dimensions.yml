name: Verify V5 CAD Dimensions

on:
  push:
    branches:
      - v5-cad-dimensions-guides
    paths:
      - .github/workflows/v5-cad-dimensions.yml
      - scripts/apply-v5-cad-dimensions.py
      - scripts/fix-v5-generated-syntax.py

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v5-cad-dimensions-guides
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Apply V5 CAD changes
        run: python3 scripts/apply-v5-cad-dimensions.py

      - name: Fix generated syntax
        run: python3 scripts/fix-v5-generated-syntax.py

      - name: Rebuild standalone
        run: node scripts/build-v3-standalone.js

      - name: Syntax and model checks
        run: |
          node --check js/model-v3.js
          node --check js/design-ops-v3.js
          node --check js/app-v3.js
          node --check tests/v5-cad-dimensions.spec.js
          node tests/model-v3.test.js
          node tests/design-ops-v3.test.js

      - name: Install Chromium
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Start server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/v5-http.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/v3-preview.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/v5-http.log
          exit 1

      - name: V5 requested regressions
        run: npx playwright test tests/v5-cad-dimensions.spec.js --reporter=line --workers=1

      - name: Full production browser regression
        run: npx playwright test tests/v3-browser-smoke.spec.js tests/v3-design-behavior.spec.js tests/v3-precision.spec.js tests/v3-export.spec.js tests/v3-cutready.spec.js tests/v3-persistence.spec.js tests/v3-standalone.spec.js tests/v3-ux-redesign.spec.js tests/v4-canvas-interactions.spec.js tests/v4-paper-guides-ux.spec.js tests/v5-cad-dimensions.spec.js --reporter=line --workers=1

      - name: Standalone consistency
        run: |
          cp StickerLayout-V3-Standalone.html /tmp/standalone-v5.html
          node scripts/build-v3-standalone.js
          cmp -s StickerLayout-V3-Standalone.html /tmp/standalone-v5.html
          grep -q 'smartDimensions:true' StickerLayout-V3-Standalone.html
          grep -q 'guideDelete:true' StickerLayout-V3-Standalone.html
          grep -q 'centerRelation:true' StickerLayout-V3-Standalone.html
          grep -q 'Smart Dimension' StickerLayout-V3-Standalone.html

      - name: Commit verified source changes
        run: |
          rm -rf node_modules test-results
          rm -f package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html v3-preview.html js/model-v3.js js/app-v3.js css/ux-redesign.css css/canvas-v4.css tests/v5-cad-dimensions.spec.js StickerLayout-V3-Standalone.html
          if git diff --cached --quiet; then
            echo 'No source changes to commit'
            exit 1
          fi
          git commit -m "feat: add CAD-style Smart Dimensions and guide deletion [skip ci]"
          git push origin HEAD:v5-cad-dimensions-guides
